                window.roomUsersCache = window.roomUsersCache || {};
                async function fetchRoomUsers(room) {
                    if (!room) return [];
                    if (window.roomUsersCache[room] && window.roomUsersCache[room].length > 0) {
                        return window.roomUsersCache[room];
                    }
                    try {
                        const token = localStorage.getItem("admin_token");
                        const res = await fetch(`${API_BASE_URL}/api/admin/room_users/${encodeURIComponent(room)}`, {
                            headers: {
                                'Authorization': `Bearer ${token}`,
                                'ngrok-skip-browser-warning': 'true',
                                'Bypass-Tunnel-Reminder': 'true'
                            }
                        });
                        if (res.ok) {
                            const data = await res.json();
                            const users = data.users || [];
                            window.roomUsersCache[room] = users;
                            return users;
                        }
                    } catch(e) {
                        console.error("fetchRoomUsers error:", e);
                    }
                    return [];
                }

                const msgInput = document.getElementById('chat-message-input');
                const mentionPopup = document.getElementById('mention-autocomplete-popup');
                let mentionActiveIndex = -1;
                let currentMentionList = [];

                const hideMentionPopup = () => {
                    if (mentionPopup) {
                        mentionPopup.style.display = 'none';
                        mentionPopup.innerHTML = '';
                    }
                    mentionActiveIndex = -1;
                    currentMentionList = [];
                };

                const selectedMentions = new Map();

                const selectMention = (userOrNick, matchStartIndex) => {
                    if (!msgInput) return;
                    const nickname = (typeof userOrNick === 'object' && userOrNick) ? userOrNick.nickname : userOrNick;
                    const userId = (typeof userOrNick === 'object' && userOrNick) ? userOrNick.user_id : null;
                    if (nickname && userId) {
                        selectedMentions.set(nickname, userId);
                    }
                    const val = msgInput.value;
                    const cursorPos = msgInput.selectionStart;
                    const before = val.slice(0, matchStartIndex);
                    const after = val.slice(cursorPos);
                    msgInput.value = `${before}@${nickname} ${after}`;
                    hideMentionPopup();
                    msgInput.focus();
                    const newPos = before.length + nickname.length + 2;
                    msgInput.setSelectionRange(newPos, newPos);
                };

                const updateMentionActive = () => {
                    if (!mentionPopup) return;
                    mentionPopup.querySelectorAll('.mention-item').forEach((el, idx) => {
                        el.classList.toggle('active', idx === mentionActiveIndex);
                        if (idx === mentionActiveIndex) el.scrollIntoView({ block: 'nearest' });
                    });
                };

                const renderMentionPopup = (users, matchStartIndex) => {
                    if (!mentionPopup) return;
                    mentionPopup.innerHTML = users.map((u, idx) => `
                        <div class="mention-item ${idx === 0 ? 'active' : ''}" data-idx="${idx}" data-nick="${escapeHtml(u.nickname)}" data-uid="${escapeHtml(u.user_id)}">
                            <img class="mention-avatar" src="${escapeHtml(u.profile_image_url || '')}" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=\\'http://www.w3.org/2000/svg\\' viewBox=\\'0 0 24 24\\' fill=\\'%23ccc\\'%3E%3Cpath d=\\'M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z\\'/%3E%3C/svg%3E';">
                            <span style="font-weight: 500;">${escapeHtml(u.nickname)}</span>
                        </div>
                    `).join('');
                    mentionPopup.style.display = 'block';

                    mentionPopup.querySelectorAll('.mention-item').forEach(item => {
                        item.addEventListener('click', () => {
                            const idx = parseInt(item.dataset.idx, 10);
                            selectMention(currentMentionList[idx] || item.dataset.nick, matchStartIndex);
                        });
                    });
                };

                msgInput?.addEventListener('input', async function(e) {
                    this.style.height = '40px';
                    this.style.height = (this.scrollHeight > 40 ? this.scrollHeight : 40) + 'px';

                    const val = this.value;
                    const cursorPos = this.selectionStart;
                    const textBeforeCursor = val.slice(0, cursorPos);
                    const atMatch = textBeforeCursor.match(/@([^\s@]*)$/);

                    if (!atMatch) {
                        hideMentionPopup();
                        return;
                    }

                    const query = atMatch[1].toLowerCase();
                    const room = document.getElementById('chat-room-input').value.trim();
                    if (!room) {
                        hideMentionPopup();
                        return;
                    }

                    const users = await fetchRoomUsers(room);
                    currentMentionList = users.filter(u => !query || u.nickname.toLowerCase().includes(query));

                    if (currentMentionList.length === 0) {
                        hideMentionPopup();
                        return;
                    }

                    mentionActiveIndex = 0;
                    renderMentionPopup(currentMentionList, atMatch.index);
                });

                msgInput?.addEventListener('keydown', function(e) {
                    if (mentionPopup && mentionPopup.style.display === 'block' && currentMentionList.length > 0) {
                        if (e.key === 'ArrowDown') {
                            e.preventDefault();
                            mentionActiveIndex = (mentionActiveIndex + 1) % currentMentionList.length;
                            updateMentionActive();
                            return;
                        } else if (e.key === 'ArrowUp') {
                            e.preventDefault();
                            mentionActiveIndex = (mentionActiveIndex - 1 + currentMentionList.length) % currentMentionList.length;
                            updateMentionActive();
                            return;
                        } else if (e.key === 'Enter' || e.key === 'Tab') {
                            if (mentionActiveIndex >= 0 && mentionActiveIndex < currentMentionList.length) {
                                e.preventDefault();
                                const textBeforeCursor = this.value.slice(0, this.selectionStart);
                                const atMatch = textBeforeCursor.match(/@([^\s@]*)$/);
                                if (atMatch) {
                                    selectMention(currentMentionList[mentionActiveIndex], atMatch.index);
                                    return;
                                }
                            }
                        } else if (e.key === 'Escape') {
                            hideMentionPopup();
                            return;
                        }
                    }
                    if (e.key === 'Enter') {
                        if (e.isComposing || e.keyCode === 229) return;
                        const enterToggle = document.getElementById('enter-to-send-toggle');
                        const isEnterToSend = enterToggle ? enterToggle.checked : true;
                        
                        if (isEnterToSend) {
                            if (!e.shiftKey) {
                                e.preventDefault();
                                document.getElementById('send-chat-btn').click();
                            }
                        } else {
                            if (e.shiftKey) {
                                e.preventDefault();
                                document.getElementById('send-chat-btn').click();
                            }
                        }
                    }
                });

                const ctxMenu = document.getElementById('chat-context-menu');
                if (ctxMenu && ctxMenu.parentElement !== document.body) {
                    document.body.appendChild(ctxMenu);
                }
                let ctxTargetData = null;
                let longPressTimer = null;
                let touchMoved = false;
                let isLongPressed = false;
                let justOpenedContextMenu = false;

                const showContextMenu = (x, y, container) => {
                    ctxTargetData = {
                        msgId: container.dataset.msgId,
                        sender: container.dataset.sender,
                        msg: container.dataset.msg
                    };
                    if (!ctxMenu) return;
                    if (ctxMenu.parentElement !== document.body) {
                        document.body.appendChild(ctxMenu);
                    }
                    ctxMenu.style.position = 'fixed';
                    ctxMenu.style.zIndex = '99999';
                    ctxMenu.style.display = 'block';
                    const menuWidth = ctxMenu.offsetWidth || 140;
                    const menuHeight = ctxMenu.offsetHeight || 150;
                    const posX = (x + menuWidth > window.innerWidth) ? (window.innerWidth - menuWidth - 10) : x;
                    const posY = (y + menuHeight > window.innerHeight) ? (window.innerHeight - menuHeight - 10) : y;
                    ctxMenu.style.left = `${Math.max(10, posX)}px`;
                    ctxMenu.style.top = `${Math.max(10, posY)}px`;
                    justOpenedContextMenu = true;
                    setTimeout(() => {
                        justOpenedContextMenu = false;
                    }, 400);
                };

                const hideContextMenu = () => {
                    if (ctxMenu) ctxMenu.style.display = 'none';
                    ctxTargetData = null;
                };

                document.addEventListener('click', (e) => {
                    if (justOpenedContextMenu) return;
                    if (ctxMenu && ctxMenu.style.display === 'block' && !ctxMenu.contains(e.target)) hideContextMenu();
                    if (mentionPopup && !mentionPopup.contains(e.target) && e.target !== msgInput) hideMentionPopup();
                });
                document.addEventListener('touchstart', (e) => {
                    if (justOpenedContextMenu) return;
                    if (ctxMenu && ctxMenu.style.display === 'block' && !ctxMenu.contains(e.target)) hideContextMenu();
                }, { passive: true });

                document.getElementById('ctx-reply-btn')?.addEventListener('click', () => {
                    if (!ctxTargetData) return;
                    window.replyTargetId = ctxTargetData.msgId;
                    document.getElementById('reply-preview-text').textContent = `${ctxTargetData.sender}에게 답장: ${ctxTargetData.msg.substring(0, 20)}...`;
                    document.getElementById('reply-target-banner').style.display = 'flex';
                    document.getElementById('chat-message-input').focus();
                    hideContextMenu();
                });

                document.getElementById('ctx-hide-btn')?.addEventListener('click', async () => {
                    if (!ctxTargetData) return;
                    const targetId = ctxTargetData.msgId;
                    const room = document.getElementById('chat-room-input').value.trim();
                    hideContextMenu();
                    if (!confirm('이 메시지를 가리시겠습니까?')) return;

                    try {
                        const token = localStorage.getItem('admin_token');
                        const res = await fetch(`${API_BASE_URL}/api/admin/chat/hide`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`,
                                'ngrok-skip-browser-warning': 'true',
                                'Bypass-Tunnel-Reminder': 'true'
                            },
                            body: JSON.stringify({ room: room, msg_id: targetId })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            alert('메시지를 성공적으로 가렸습니다.');
                            const elem = document.querySelector(`.chat-bubble-container[data-msg-id="${targetId}"]`);
                            if (elem) {
                                const bubble = elem.querySelector('.chat-bubble');
                                if (bubble) bubble.textContent = '가려진 메시지입니다.';
                            }
                        } else {
                            alert(data.error || '메시지 가리기에 실패했습니다.');
                        }
                    } catch (e) {
                        alert('서버와 통신할 수 없습니다.');
                    }
                });

                document.getElementById('ctx-modify-btn')?.addEventListener('click', async () => {
                    if (!ctxTargetData) return;
                    const targetId = ctxTargetData.msgId;
                    const originalMsg = ctxTargetData.msg;
                    const room = document.getElementById('chat-room-input').value.trim();
                    hideContextMenu();

                    const newMsg = prompt('수정할 메시지 내용을 입력하세요 (5분 이내 봇 메시지만 가능):', originalMsg);
                    if (newMsg === null || !newMsg.trim() || newMsg.trim() === originalMsg) return;

                    try {
                        const token = localStorage.getItem('admin_token');
                        const res = await fetch(`${API_BASE_URL}/api/admin/chat/modify`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`,
                                'ngrok-skip-browser-warning': 'true',
                                'Bypass-Tunnel-Reminder': 'true'
                            },
                            body: JSON.stringify({ room: room, msg_id: targetId, msg: newMsg.trim() })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            alert('메시지가 성공적으로 수정되었습니다.');
                            const elem = document.querySelector(`.chat-bubble-container[data-msg-id="${targetId}"]`);
                            if (elem) {
                                elem.dataset.msg = newMsg.trim();
                                const bubble = elem.querySelector('.chat-bubble');
                                if (bubble) bubble.textContent = newMsg.trim();
                            }
                        } else {
                            alert(data.error || '메시지 수정에 실패했습니다.');
                        }
                    } catch (e) {
                        alert('서버와 통신할 수 없습니다.');
                    }
                });

                document.getElementById('ctx-copy-btn')?.addEventListener('click', () => {
                    if (!ctxTargetData) return;
                    navigator.clipboard.writeText(ctxTargetData.msg).then(() => {
                        alert('메시지가 복사되었습니다.');
                    }).catch(() => {
                        alert('복사에 실패했습니다.');
                    });
                    hideContextMenu();
                });
                
                const chatContainer = document.getElementById('chat-messages-container');
                let swipeStartX = 0;
                let swipeStartY = 0;
                let currentSwipeElement = null;
                let replyIcon = null;
                let isSwiping = false;

                const startSwipe = (e) => {
                    const target = e.target.closest('.chat-bubble-container');
                    if (!target) return;
                    if (ctxMenu && ctxMenu.style.display === 'block') return;
                    touchMoved = false;
                    isLongPressed = false;
                    const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                    const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                    swipeStartX = clientX;
                    swipeStartY = clientY;
                    currentSwipeElement = target.querySelector('.chat-bubble-wrapper');
                    replyIcon = target.querySelector('.reply-action-icon');
                    isSwiping = true;
                    if (currentSwipeElement) currentSwipeElement.style.transition = 'none';

                    if (longPressTimer) clearTimeout(longPressTimer);
                    longPressTimer = setTimeout(() => {
                        if (!touchMoved) {
                            isLongPressed = true;
                            showContextMenu(clientX, clientY, target);
                            if (currentSwipeElement) {
                                currentSwipeElement.style.transition = 'transform 0.3s ease';
                                currentSwipeElement.style.transform = 'translateX(0px)';
                            }
                            if (replyIcon) replyIcon.style.right = '-50px';
                            isSwiping = false;
                        }
                    }, 500);
                };

                const moveSwipe = (e) => {
                    if (!isSwiping || !currentSwipeElement) return;
                    const clientX = e.type.includes('mouse') ? e.clientX : e.touches[0].clientX;
                    const clientY = e.type.includes('mouse') ? e.clientY : e.touches[0].clientY;
                    const diffX = clientX - swipeStartX;
                    const diffY = clientY - swipeStartY;

                    if (Math.abs(diffX) > 8 || Math.abs(diffY) > 8) {
                        touchMoved = true;
                        if (longPressTimer) {
                            clearTimeout(longPressTimer);
                            longPressTimer = null;
                        }
                    }

                    if (diffX < 0) {
                        const moveX = Math.max(diffX, -60);
                        currentSwipeElement.style.transform = `translateX(${moveX}px)`;
                        if (replyIcon) replyIcon.style.right = `${10 - (moveX + 60)}px`;
                    }
                };

                const endSwipe = (e) => {
                    if (longPressTimer) {
                        clearTimeout(longPressTimer);
                        longPressTimer = null;
                    }
                    if (isLongPressed) {
                        isLongPressed = false;
                        isSwiping = false;
                        currentSwipeElement = null;
                        replyIcon = null;
                        return;
                    }
                    if (!isSwiping || !currentSwipeElement) return;
                    const clientX = e.type.includes('mouse') ? e.clientX : (e.changedTouches ? e.changedTouches[0].clientX : swipeStartX);
                    const diffX = clientX - swipeStartX;
                    
                    currentSwipeElement.style.transition = 'transform 0.3s ease';
                    currentSwipeElement.style.transform = `translateX(0px)`;
                    if (replyIcon) replyIcon.style.right = `-50px`;
                    
                    if (diffX < -40) {
                        const container = currentSwipeElement.closest('.chat-bubble-container');
                        if (container) {
                            window.replyTargetId = container.dataset.msgId;
                            document.getElementById('reply-preview-text').textContent = `${container.dataset.sender}에게 답장: ${container.dataset.msg.substring(0, 20)}...`;
                            document.getElementById('reply-target-banner').style.display = 'flex';
                            document.getElementById('chat-message-input').focus();
                        }
                    }
                    isSwiping = false;
                    currentSwipeElement = null;
                    replyIcon = null;
                };

                chatContainer.addEventListener('touchstart', startSwipe, {passive: true});
                chatContainer.addEventListener('touchmove', moveSwipe, {passive: true});
                chatContainer.addEventListener('touchend', endSwipe);
                
                chatContainer.addEventListener('mousedown', startSwipe);
                chatContainer.addEventListener('mousemove', moveSwipe);
                chatContainer.addEventListener('mouseup', endSwipe);
                chatContainer.addEventListener('mouseleave', endSwipe);

                chatContainer.addEventListener('contextmenu', (e) => {
                    const target = e.target.closest('.chat-bubble-container');
                    if (target) {
                        e.preventDefault();
                        showContextMenu(e.clientX, e.clientY, target);
                    }
                });

                let isSendingText = false;

                document.getElementById('send-chat-btn').addEventListener('click', async () => {
                    if (isSendingText) return;

                    const roomInput = document.getElementById('chat-room-input');
                    const msgInput = document.getElementById('chat-message-input');
                    const msg = msgInput ? msgInput.value.trim() : "";
                    if (!msg) {
                        return;
                    }
                    if (roomInput && !roomInput.value.trim()) {
                        roomInput.value = "184029182390192";
                    }
                    const room = roomInput ? roomInput.value.trim() : "184029182390192";

                    if (window.sendWebKakaoMessage) {
                        window.sendWebKakaoMessage(msg);
                    }

                    if (msgInput) {
                        msgInput.value = "";
                        msgInput.style.height = '40px';
                    }

                    const token = localStorage.getItem("admin_token");
                    if (!token) return;

                    isSendingText = true;

                    try {
                        const threadId = window.replyTargetId || null;
                        const prefixToggle = document.getElementById('prefix-toggle');
                        const usePrefix = prefixToggle ? prefixToggle.checked : false;
                        const scopeToggle = document.getElementById('reply-scope-toggle');

                        const mentions = [];
                        const atMatches = msg.match(/@([^\s@]+)/g);
                        if (atMatches) {
                            const roomUsers = (window.roomUsersCache && window.roomUsersCache[room]) ? window.roomUsersCache[room] : [];
                            for (const match of atMatches) {
                                const nick = match.slice(1);
                                let uid = selectedMentions.get(nick);
                                if (!uid && roomUsers.length > 0) {
                                    const found = roomUsers.find(u => u.nickname === nick);
                                    if (found) uid = found.user_id;
                                }
                                if (uid) {
                                    mentions.push({ user_id: uid, nickname: nick });
                                }
                            }
                        }

                        const payload = { type: "text", room: room, msg: msg, use_prefix: usePrefix };
                        if (mentions.length > 0) {
                            payload.mentions = mentions;
                        }
                        if (threadId) {
                            payload.thread_id = threadId;
                            payload.scope = (scopeToggle && scopeToggle.checked) ? 1 : 0;
                        }

                        const response = await fetch(`${API_BASE_URL}/api/admin/reply`, {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                                'Authorization': `Bearer ${token}`,
                                'ngrok-skip-browser-warning': 'true',
                                'Bypass-Tunnel-Reminder': 'true'
                            },
                            body: JSON.stringify(payload)
                        });

                        if (response.ok) {
                            selectedMentions.clear();
                            window.replyTargetId = null;
                            const banner = document.getElementById('reply-target-banner');
                            if (banner) banner.style.display = 'none';
                        }
                    } catch (e) {
                        // ignore API error during local KakaoTalk test
                    } finally {
                        isSendingText = false;
                    }
                });

                document.getElementById('attach-image-btn').addEventListener('click', () => {
                    document.getElementById('chat-image-input').click();
                });
                
                document.getElementById('chat-image-input').addEventListener('change', async function(e) {
                    const files = e.target.files;
                    if (!files || files.length === 0) return;

                    const room = document.getElementById('chat-room-input').value.trim();
                    if (!room) {
                        alert("방 아이디를 입력해주세요.");
                        this.value = "";
                        return;
                    }

                    const confirmMsg = files.length === 1 
                        ? (files[0].type.startsWith('image/') ? '사진 1장을 전송할까요?' : `'${files[0].name}' 파일을 전송할까요?`)
                        : `${files.length}개의 파일을 전송할까요?`;

                    if (confirm(confirmMsg)) {
                        const token = localStorage.getItem("admin_token");
                        const prefixToggle = document.getElementById('prefix-toggle');
                        const threadId = window.replyTargetId || null;
                        const scopeToggle = document.getElementById('reply-scope-toggle');
                        const scopeVal = (scopeToggle && scopeToggle.checked) ? 1 : 0;
                        
                        try {
                            for (let i = 0; i < files.length; i++) {
                                const file = files[i];
                                const base64Data = await new Promise((resolve) => {
                                    const reader = new FileReader();
                                    reader.onload = function(event) {
                                        resolve(event.target.result.split(',')[1]);
                                    };
                                    reader.readAsDataURL(file);
                                });

                                const isImage = file.type.startsWith('image/');
                                const payload = { 
                                    type: isImage ? "image" : "file", 
                                    room: room, 
                                    data: base64Data,
                                    filename: file.name,
                                    file_type: file.type || "application/octet-stream",
                                    use_prefix: prefixToggle ? prefixToggle.checked : true
                                };
                                if (threadId) {
                                    payload.thread_id = threadId;
                                    payload.scope = scopeVal;
                                }

                                const targetUrl = isImage ? `${API_BASE_URL}/api/admin/reply` : `${API_BASE_URL}/api/admin/chat/file`;
                                const response = await fetch(targetUrl, {
                                    method: 'POST',
                                    headers: {
                                        'Content-Type': 'application/json',
                                        'Authorization': `Bearer ${token}`,
                                        'ngrok-skip-browser-warning': 'true',
                                        'Bypass-Tunnel-Reminder': 'true'
                                    },
                                    body: JSON.stringify(payload)
                                });

                                if (!response.ok) {
                                    alert(`전송에 실패했습니다: ${file.name}\n관리자에게 문의해주세요.`);
                                    break;
                                }
                            }

                            window.replyTargetId = null;
                            document.getElementById('reply-target-banner').style.display = 'none';
                        } catch (e) {
                            alert("서버와 통신할 수 없습니다.\n관리자에게 문의해주세요.");
                        }
                    }
                    this.value = "";
                });
            }
        }
    }

    window.currentProfileTarget = null;
    window.activeProfileImg = null;

    function updateProfileModalPosition() {
        const modalOverlay = document.getElementById("user-profile-modal");
        if (!modalOverlay || modalOverlay.style.display === "none" || !window.activeProfileImg) return;
        
        const modalCard = modalOverlay.querySelector(".modal-card");
        const chatContainer = document.getElementById("chat-messages-container");
        if (!chatContainer || !modalCard) return;

        const chatRect = chatContainer.getBoundingClientRect();
        const rect = window.activeProfileImg.getBoundingClientRect();
        const cardHeight = modalCard.offsetHeight || 200;
        const cardWidth = 340;
        
        if (rect.bottom < chatRect.top || rect.top > chatRect.bottom) {
            modalOverlay.style.display = "none";
            window.activeProfileImg = null;
            return;
        }

        let leftPos = rect.right + 10;
        if (leftPos + cardWidth > chatRect.right) {
            leftPos = rect.left - cardWidth - 10;
            if (leftPos < chatRect.left) {
                leftPos = chatRect.left + 10;
            }
        }
        
        let topPos = rect.top;
        
        if (topPos + cardHeight > chatRect.bottom) {
            topPos = rect.bottom - cardHeight;
            
            if (topPos < chatRect.top) {
                topPos = Math.max(chatRect.top + 10, chatRect.top + (chatRect.height - cardHeight) / 2);
            }
        } else if (topPos < chatRect.top) {
            topPos = chatRect.top + 10;
        }
        
        modalCard.style.position = "fixed";
        modalCard.style.left = leftPos + "px";
        modalCard.style.top = topPos + "px";
        modalCard.style.margin = "0";
    }

    document.addEventListener("scroll", updateProfileModalPosition, { capture: true, passive: true });

    document.addEventListener("click", (event) => {
        const profileImg = event.target.closest(".chat-profile-img");
        if (profileImg) {
            const container = profileImg.closest(".chat-bubble-container");
            if (container) {
                const senderId = container.dataset.sender;
                const senderNameElem = container.querySelector(".chat-sender");
                let senderName = "Unknown";
                if (senderNameElem) {
                    senderName = senderNameElem.childNodes[0].textContent.trim();
                }

                window.currentProfileTarget = senderId;
                
                document.getElementById("user-profile-img").src = profileImg.src;
                document.getElementById("user-profile-name").textContent = senderName;
                document.getElementById("user-profile-sub").innerHTML = `${escapeHtml(senderId)}`;

                const tagsContainer = document.getElementById("user-profile-tags");
                Array.from(tagsContainer.children).forEach(child => {
                    if(child.id !== 'edit-tag-btn') {
                        child.remove();
                    }
                });

                try {
                    const rawTags = container.dataset.tags || "[]";
                    const userTags = JSON.parse(rawTags);
                    const editBtn = document.getElementById("edit-tag-btn");
                    userTags.forEach((tag) => {
                        const tagEl = document.createElement("div");
                        tagEl.className = "discord-tag";
                        tagEl.innerHTML = `<span>${escapeHtml(tag)}</span>`;
                        tagsContainer.insertBefore(tagEl, editBtn);
                    });
                } catch(e) {
                    alert("태그를 불러오는데 실패했습니다.\n관리자에게 문의해주세요.");
                }
                
                const modalOverlay = document.getElementById("user-profile-modal");
                
                window.activeProfileImg = profileImg;
                
                modalOverlay.style.visibility = "hidden";
                modalOverlay.style.display = "block";
                
                updateProfileModalPosition();
                
                modalOverlay.style.visibility = "visible";
            }
        }
    });

    document.getElementById("user-profile-modal").addEventListener("click", (e) => {
        if (e.target.id === "user-profile-modal") {
            document.getElementById("user-profile-modal").style.display = "none";
            window.activeProfileImg = null;
        }
    });

    document.getElementById("close-tag-editor-btn")?.addEventListener("click", () => {
        document.getElementById("tag-editor-modal").style.display = "none";
        document.getElementById("user-profile-modal").style.display = "block";
        updateProfileModalPosition();
    });

    document.getElementById("edit-tag-btn")?.addEventListener("click", async () => {
        const targetId = window.currentProfileTarget;
        if (!targetId) return;

        const token = localStorage.getItem("admin_token");
        if (!token) return;

        try {
            const availableTags = window.availableTagsCache || [];

            const userTagsRes = await fetch(`${API_BASE_URL}/api/tags/user/${targetId}`, {
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'ngrok-skip-browser-warning': 'true',
                    'Bypass-Tunnel-Reminder': 'true'
                }
            });
            
            if (!userTagsRes.ok) {
                alert("요청을 처리하지 못했습니다. 관리자에게 문의해주세요.");
                return;
            }

            const userTagsData = await userTagsRes.json();
            const userTags = userTagsData.tags || [];

            const listContainer = document.getElementById("tag-checkbox-list");
            listContainer.innerHTML = "";
            
            if (availableTags.length === 0) {
                listContainer.innerHTML = "<span style='color:var(--text-muted)'>추가된 태그가 없습니다.</span>";
            } else {
                availableTags.forEach(tag => {
                    const isChecked = userTags.includes(tag) ? "checked" : "";
                    listContainer.innerHTML += `
                        <label style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.5rem; color:var(--text-main); cursor:pointer;">
                            <input type="checkbox" class="tag-checkbox" value="${escapeHtml(tag)}" ${isChecked}>
                            ${escapeHtml(tag)}
                        </label>
                    `;
                });
            }

            document.getElementById("user-profile-modal").style.display = "none";
            document.getElementById("tag-editor-modal").style.display = "flex";

        } catch (e) {
            alert("서버와 통신할 수 없습니다.\n관리자에게 문의해주세요.");
        }
    });

    document.getElementById("save-tags-btn")?.addEventListener("click", async () => {
        const targetId = window.currentProfileTarget;
        if (!targetId) return;

        const token = localStorage.getItem("admin_token");
        const checkboxes = document.querySelectorAll(".tag-checkbox:checked");
        const selectedTags = Array.from(checkboxes).map(cb => cb.value);

        try {
            const res = await fetch(`${API_BASE_URL}/api/tags/user/${targetId}`, {
                method: "POST",
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    'ngrok-skip-browser-warning': 'true',
                    'Bypass-Tunnel-Reminder': 'true'
                },
                body: JSON.stringify({ tags: selectedTags })
            });

            if (res.ok) {
                alert("태그가 저장됐습니다.");
                document.getElementById("tag-editor-modal").style.display = "none";
                
                const tagsContainer = document.getElementById("user-profile-tags");
                Array.from(tagsContainer.children).forEach(child => {
                    if(child.id !== 'edit-tag-btn') {
                        child.remove();
                    }
                });
                const editBtn = document.getElementById("edit-tag-btn");
                selectedTags.forEach((tag) => {
                    const tagEl = document.createElement("div");
                    tagEl.className = "discord-tag";
                    tagEl.innerHTML = `<span>${escapeHtml(tag)}</span>`;
                    tagsContainer.insertBefore(tagEl, editBtn);
                });

                document.querySelectorAll(`.chat-bubble-container[data-sender="${targetId}"]`).forEach(container => {
                    container.dataset.tags = JSON.stringify(selectedTags);
                    const senderDiv = container.querySelector('.chat-sender');
                    const tagsWrapper = senderDiv.querySelector('.chat-tags-wrapper');
                    if (tagsWrapper) tagsWrapper.remove();
                    if (selectedTags.length > 0) {
                        const newTagsWrapper = document.createElement("div");
                        newTagsWrapper.className = "chat-tags-wrapper";
                        newTagsWrapper.innerHTML = selectedTags.map(tag => `<span class="chat-tag">${escapeHtml(tag)}</span>`).join("");
                        senderDiv.appendChild(newTagsWrapper);
                    }
                });

                document.getElementById("user-profile-modal").style.display = "block";
                updateProfileModalPosition();
            } else {
                alert("태그를 저장하는데 실패했습니다.\n관리자에게 문의해주세요.");
            }
        } catch (e) {
            alert("오류가 발생했습니다.\n관리자에게 문의해주세요.");
        }
    });
    </script>
</body>
</html>
